<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>תצוגה</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light;--page:#f4f3ef;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--mute:#898781;--grid:#e1e0d9;--line:rgba(11,11,11,.10);--wash:rgba(11,11,11,.045);
  --bibi:#2a78d6;--change:#00700a;--arab:#ee5a4f;--rest:#d9d8d1}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0d0d0d;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#2c2c2a;--line:rgba(255,255,255,.10);--wash:rgba(255,255,255,.06);
  --bibi:#3987e5;--change:#1f9a3a;--arab:#e66767;--rest:#3a3a37}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 15.5px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--page) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px}
h1{font-size:18px;margin:0;font-weight:800}
.st{font-size:13.5px;color:var(--ink2)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.note{font-size:13px;color:var(--mute);margin:14px 0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
input[type=search],input[type=text]{flex:1 1 200px;min-width:0}
button{cursor:pointer;font-weight:600}button:hover{background:var(--wash)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.card h2{font-size:16px;margin:0;font-weight:800;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.badge{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink2);background:var(--wash)}
.row{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;margin:6px 0;font-size:13.5px}
.row .lab{color:var(--ink2)}
.bars{display:flex;height:12px;gap:2px}.bars i{display:block;min-width:0}
.bars .b{background:var(--bibi)}.bars .c{background:var(--change)}.bars .a{background:var(--arab)}.bars .r{background:var(--rest);flex:1}
.bars i:first-child{border-radius:0 6px 6px 0}.bars i:last-child{border-radius:6px 0 0 6px}
.val{display:flex;justify-content:space-between;gap:8px;margin-top:2px;color:var(--ink2);font-size:12.5px}
.lines p{margin:6px 0;color:var(--ink2);font-size:14px}
.lines p.sc{color:var(--ink);background:var(--wash);border-radius:10px;padding:8px 10px}
.foot{font-size:12.5px;color:var(--mute);margin-top:8px}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px}
.err{padding:40px 10px;text-align:center;color:var(--ink2)}
@media (max-width:520px){.row{grid-template-columns:44px 1fr}}
</style>
</head>
<body>
<header><div class="wrap bar"><h1>קלפיות לבדיקה</h1><div class="st" id="st">…</div></div></header>
<main class="wrap">
  <div id="gate" class="err" hidden>
    <p>הדף דורש מפתח. הדבק אותו כאן (או פתח את הקישור המלא שכולל אותו):</p>
    <div class="ctl" style="justify-content:center"><input type="text" id="k" autocomplete="off" spellcheck="false" aria-label="מפתח"><button id="kgo">פתח</button></div>
  </div>
  <div id="app" hidden>
    <div class="ctl">
      <input type="search" id="q" placeholder="חיפוש יישוב" aria-label="חיפוש יישוב">
      <select id="ft" aria-label="סוג סימון"><option value="">כל הסימונים</option><option value="bloc_shift_vs_2022">שינוי מול אותה קלפי ב-2022</option>
        <option value="peers">חריג מול קלפיות דומות או מול היישוב</option><option value="integrity">אי-התאמה בנתוני הקלפי</option></select>
      <button id="csv">הורדת הכול (CSV)</button>
    </div>
    <div class="note" id="cnt"></div>
    <div id="list"></div>
    <p class="note">חריג סטטיסטית אינו הוכחה לטעות או לזיוף. זו רשימה לבדיקה מול פרוטוקול הקלפי. התרחישים הם כללים אוטומטיים, לא מסקנה.</p>
  </div>
  <div id="msg" class="err" hidden></div>
</main>
<script>
(() => {
'use strict';
const API_URL = 'https://api.github.com/repos/Yedidiwah/-2026/contents/boxes.enc.json?ref=data';
const RAW_URL = 'https://raw.githubusercontent.com/Yedidiwah/-2026/data/boxes.enc.json';
const params = new URLSearchParams(location.search);
const isLocal = /^(localhost|127\.0\.0\.1|\[::1\]|)$/.test(location.hostname);
const DATA_URL = params.get('data') || (isLocal ? 'data/boxes.enc.json' : RAW_URL);
const $ = (s) => document.querySelector(s);
const clear = (e) => { while (e.firstChild) e.removeChild(e.firstChild); return e; };
const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) if (v != null && v !== false) { if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v; else e.setAttribute(k, v); }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
};
const num = (t) => h('span', {class: 'num'}, t);
const WORDS = {bloc_shift_vs_2022: 'שינוי מול אותה קלפי ב-2022', share_vs_prior_election_peers: 'חריג מול קלפיות דומות', share_vs_tonights_siblings: 'חריג מול היישוב הערב',
  integrity_ballots_vs_voters: 'אי-התאמה בנתוני הקלפי', integrity_impossible_turnout: 'אי-התאמה בנתוני הקלפי'};
let DATA = null, key = location.hash.slice(1), stamp = null;

const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(blob, keyText) {
  const pad = keyText.replace(/-/g, '+').replace(/_/g, '/'), raw = unb64(pad + '='.repeat((4 - pad.length % 4) % 4));
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(blob.iv)}, k, unb64(blob.ct));
  const text = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(text);
}
async function fetchBlob() {
  if (DATA_URL === RAW_URL) {
    try { const r = await fetch(API_URL, {headers: {Accept: 'application/vnd.github.raw+json'}, cache: 'no-cache'}); if (r.ok) return await r.json(); } catch (e) { /* fall back to raw */ }
  }
  const r = await fetch(DATA_URL + (DATA_URL.includes('?') ? '&' : '?') + 't=' + Math.floor(Date.now() / 30000), {cache: 'no-store'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function bars(label, b, c, a) {
  if (b == null) return h('div', {class: 'row'}, h('div', {class: 'lab'}, label), h('div', {class: 'val'}, 'אין קלפי תואמת באותו מספר'));
  const w = (v) => `flex:0 0 ${Math.max(0, v)}%`;
  return h('div', {class: 'row'}, h('div', {class: 'lab'}, label), h('div', {},
    h('div', {class: 'bars', role: 'img', 'aria-label': `${label}: ביבי ${b}%, שינוי ${c}%, ערבים ${a}%`}, h('i', {class: 'b', style: w(b)}), h('i', {class: 'c', style: w(c)}), h('i', {class: 'a', style: w(a)}), h('i', {class: 'r'})),
    h('div', {class: 'val'}, h('span', {}, h('span', {class: 'sw', style: 'background:var(--bibi)'}), 'ביבי ', num(b + '%')),
      h('span', {}, h('span', {class: 'sw', style: 'background:var(--change)'}), 'שינוי ', num(c + '%')),
      h('span', {}, h('span', {class: 'sw', style: 'background:var(--arab)'}), 'ערבים ', num(a + '%')))));
}
function card(it) {
  const r = it.rec, kinds = [...new Set(it.flags.map((f) => WORDS[f] || f))];
  const lines = it.lines.slice(3);
  return h('div', {class: 'card'},
    h('h2', {}, `${r['יישוב']} · קלפי ${r['קלפי']}`, kinds.map((k) => h('span', {class: 'badge'}, k))),
    bars('הערב', r['ביבי הערב %'], r['שינוי הערב %'], r['ערבים הערב %']),
    bars('2022', r['ביבי 2022 %'], r['שינוי 2022 %'], r['ערבים 2022 %']),
    bars('2021', r['ביבי 2021 %'], r['שינוי 2021 %'], r['ערבים 2021 %']),
    h('div', {class: 'lines'}, lines.map((l) => h('p', {class: l.startsWith('תרחיש') ? 'sc' : ''}, l))),
    h('div', {class: 'foot'}, 'בעלי זכות בחירה: הערב ', num(r['בעלי זכות בחירה הערב']), r['בעלי זכות בחירה 2022'] ? [' · 2022 ', num(r['בעלי זכות בחירה 2022'])] : '',
      r['בעלי זכות בחירה 2021'] ? [' · 2021 ', num(r['בעלי זכות בחירה 2021'])] : '', ' · קולות כשרים הערב ', num(r['קולות כשרים הערב'])));
}
function matches(it) {
  const q = $('#q').value.trim(), ft = $('#ft').value;
  if (q && !it.rec['יישוב'].includes(q)) return false;
  if (ft === 'bloc_shift_vs_2022') return it.flags.includes('bloc_shift_vs_2022');
  if (ft === 'peers') return it.flags.some((f) => f.startsWith('share_vs'));
  if (ft === 'integrity') return it.flags.some((f) => f.startsWith('integrity'));
  return true;
}
function render() {
  if (!DATA) return;
  const shown = DATA.items.filter(matches);
  clear($('#list')).append(...shown.slice(0, 80).map(card));
  $('#cnt').textContent = `${DATA.flagged_total} קלפיות סומנו עד כה מתוך ${DATA.counted.boxes.toLocaleString('he-IL')} שנספרו · מוצגות ${Math.min(shown.length, 80)} מתוך ${shown.length} (הגדולות ביותר קודם). הורדת ה-CSV כוללת את כולן.`;
  $('#st').textContent = `עודכן ${DATA.updated_hm}`;
}
function csv() {
  const rows = DATA.items.map((i) => i.rec), cols = Object.keys(rows[0] || {});
  const esc = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const text = '﻿' + [cols.map(esc).join(','), ...rows.map((r) => cols.map((c) => esc(r[c])).join(','))].join('\r\n');
  const a = h('a', {href: URL.createObjectURL(new Blob([text], {type: 'text/csv;charset=utf-8'})), download: 'boxes.csv'});
  document.body.append(a); a.click(); a.remove();
}
function show(which, text) {
  $('#gate').hidden = which !== 'gate'; $('#app').hidden = which !== 'app'; $('#msg').hidden = which !== 'msg';
  if (text) $('#msg').textContent = text;
}
async function load() {
  if (!key) { show('gate'); return; }
  try {
    const blob = await fetchBlob();
    const d = await decrypt(blob, key);
    if (d.updated !== stamp) { stamp = d.updated; DATA = d; }
    show('app'); render();
  } catch (e) {
    show('msg', e && e.name === 'OperationError' ? 'המפתח שגוי, או שהרשימה עוד לא פורסמה.' : 'לא הצלחתי לטעון את הרשימה כרגע. נסה לרענן בעוד רגע.');
  }
}
$('#kgo').addEventListener('click', () => { const v = $('#k').value.trim(); if (v) { location.hash = v; location.reload(); } });
$('#q').addEventListener('input', render); $('#ft').addEventListener('change', render); $('#csv').addEventListener('click', csv);
history.replaceState(null, '', location.pathname + location.search + location.hash);
load(); setInterval(() => { if (!document.hidden) load(); }, 90000);
})();
</script>
</body>
</html>
